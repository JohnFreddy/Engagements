<svg xmlns="http://www.w3.org/2000/svg" width="680" height="265" viewBox="0 0 680 265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Merging the REVIEW-CA tolerance change</title>
<desc>Version 6 to 7 changes the analytics tolerance from 0.15 to 0.12, and 7 to 8 from 0.12 to 0.10. Joining the diffs reports two threshold changes; merging them reports one, from 0.15 to 0.10.</desc>
<rect width="680" height="265" fill="#ffffff"/>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="227" y="48" text-anchor="middle" font-size="12" fill="#5F5E5A">0.15 to 0.12</text>
<text x="452" y="48" text-anchor="middle" font-size="12" fill="#5F5E5A">0.12 to 0.10</text>

<rect x="60" y="60" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">v6</text>
<rect x="285" y="60" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">v7</text>
<rect x="510" y="60" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="565" y="87" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">v8</text>

<line x1="170" y1="82" x2="283" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="395" y1="82" x2="508" y2="82" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<path d="M115 112 L115 122 L565 122 L565 112" fill="none" stroke="#888780" stroke-width="0.5"/>
<path d="M340 122 L340 145 L190 145 L190 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<path d="M340 122 L340 145 L490 145 L490 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="60" y="163" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="190" y="189" text-anchor="middle" font-size="14" font-weight="500" fill="#501313">Diffs joined together</text>
<text x="190" y="207" text-anchor="middle" font-size="12" fill="#A32D2D">two threshold changes</text>

<rect x="360" y="163" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="189" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Merged net effect</text>
<text x="490" y="207" text-anchor="middle" font-size="12" fill="#0F6E56">one change, 0.15 to 0.10</text>

<text x="340" y="247" text-anchor="middle" font-size="12" fill="#5F5E5A">Analytics tolerance, REVIEW-CA v6 to v8</text>
</svg>
