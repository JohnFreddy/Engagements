<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>Pending template update architecture</title>
<desc>The template registry and the engagement system emit events to a bus. An update projector and a summary cache consume them and write a read model, which the Angular client reads. Decisions go back to the engagement system.</desc>
<rect width="680" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="50" y="40" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="175" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Template registry</text>
<text x="175" y="84" text-anchor="middle" font-size="12" fill="#5F5E5A">all template versions</text>

<rect x="380" y="40" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="505" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Engagement system</text>
<text x="505" y="84" text-anchor="middle" font-size="12" fill="#5F5E5A">create, apply, decline</text>

<line x1="175" y1="96" x2="175" y2="143" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="505" y1="96" x2="505" y2="143" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="145" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="171" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Event bus</text>
<text x="340" y="189" text-anchor="middle" font-size="12" fill="#0F6E56">publish and decision events</text>

<line x1="175" y1="201" x2="175" y2="243" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="505" y1="201" x2="505" y2="243" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="245" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="175" y="271" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Update projector</text>
<text x="175" y="289" text-anchor="middle" font-size="12" fill="#0F6E56">computes pending versions</text>

<rect x="380" y="245" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="505" y="271" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Summary cache</text>
<text x="505" y="289" text-anchor="middle" font-size="12" fill="#0F6E56">diff to plain language</text>

<path d="M175 301 L175 320 L260 320 L260 338" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M505 301 L505 320 L420 320 L420 338" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="340" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="366" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Read model</text>
<text x="340" y="384" text-anchor="middle" font-size="12" fill="#0F6E56">status per engagement</text>

<line x1="300" y1="396" x2="300" y2="433" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="312" y="420" font-size="12" fill="#5F5E5A">GET status and summary</text>

<rect x="190" y="435" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="461" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Angular client</text>
<text x="340" y="479" text-anchor="middle" font-size="12" fill="#993C1D">badge, summary, apply</text>

<path d="M420 491 L420 510 L650 510 L650 68 L636 68" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="640" y="503" text-anchor="end" font-size="12" fill="#5F5E5A">apply / decline decision</text>
</svg>
